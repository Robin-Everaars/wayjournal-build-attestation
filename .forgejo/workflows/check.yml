name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: nix
    steps:
      - name: Check out source
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run the reproducible gate
        run: nix flake check --print-build-logs
